; =====================================================================
; ESP32 + 1.8" ST7735 (128x160) TFT Hardware Test Firmware
; Display configuration lives entirely inside src/main.ino (LovyanGFX
; in-sketch class) - no User_Setup.h edits or display build_flags needed.
;
; Flash:  pio run -t upload
; Serial: pio device monitor  (115200 baud)
; =====================================================================
[env:esp32dev]
; Pinned: arduino-esp32 3.3.x restructured its WiFi/Network libraries and
; breaks PlatformIO's LDF; core 2.0.17 (platform 6.9.0) is stable and
; fully supports this project (LEDC, WiFiClientSecure, DMA sprite).
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; WiFi headers include the framework's Network library indirectly
; (WiFiGeneric.h -> Network.h); chain-mode LDF misses it, so scan deep.
lib_ldf_mode = deep
; upload_port / monitor_port: leave unset for auto-detection,
; or hardcode e.g. COM5 / /dev/ttyUSB0 if multiple ports are present.

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.0.4
    knolleary/PubSubClient@^2.8

build_flags =
    -DMQTT_MAX_PACKET_SIZE=4096
